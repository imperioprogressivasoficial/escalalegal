# Publica no VPS sozinho a cada push na main, se os testes passarem.
# Para ligar, crie em Settings > Secrets and variables > Actions:
#   VPS_HOST     IP do VPS
#   VPS_USER     usuário SSH (ex.: root)
#   VPS_SSH_KEY  chave privada SSH com acesso ao VPS
#   ADMIN_PASS   senha que você quer para o /admin (usada só na primeira instalação)
# e em Settings > Secrets and variables > Actions > Variables:
#   VPS_DOMINIO  domínio do app (ex.: escala.seudominio.com.br)
# Na primeira vez ele mesmo clona o projeto em /opt/escalalegal e instala tudo.
name: Deploy no VPS
on:
  workflow_run:
    workflows: [Testes]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency: deploy-vps
    steps:
      - name: Conferir segredos
        id: seg
        env: { H: "${{ secrets.VPS_HOST }}" }
        run: if [ -n "$H" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::notice::Deploy automático desligado (faltam os segredos VPS_HOST, VPS_USER, VPS_SSH_KEY)."; fi
      - name: Atualizar no VPS
        if: steps.seg.outputs.ok == '1'
        uses: appleboy/ssh-action@v1.2.0
        env:
          ADMIN_PASS_INICIAL: ${{ secrets.ADMIN_PASS }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          envs: ADMIN_PASS_INICIAL
          script: |
            set -e
            command -v git >/dev/null || (apt-get update -qq && apt-get install -y -qq git)
            if [ ! -d /opt/escalalegal/.git ]; then
              git clone https://github.com/${{ github.repository }} /opt/escalalegal
            fi
            cd /opt/escalalegal
            git pull --ff-only
            bash deploy/instalar.sh "${{ vars.VPS_DOMINIO }}"
